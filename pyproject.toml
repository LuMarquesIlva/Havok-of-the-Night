[project]
name = "Havok_of_the_Night"
version = "0.1.0"
description = "Havok of the Night Game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "legacy-cgi; python_version >= '3.13'"
]

[dependency-groups]
dev = [
    "meson>=1.11.1",
    "cython<=3.1.0",
    "kivy>=2.3.1; platform_machine == 'x86_64'",
    "pillow>=12.2.0",
    "pygame>=2.6.1",
    "legacy-cgi>=2.6.4",
]

[tool.uv.extra-build-dependencies]
    cython = ["legacy-cgi"]
    kivy = ["cython<=3.1.0"]
